<style>
/* Dark-first: die Grundtöne sind das dunkle Schema, Hell wird darüber gelegt */
:root {
  color-scheme: dark;
  --ground: #090D17;
  --bg: #0E1320;
  --surface: #161C2C;
  --surface-2: #1E2638;
  --line: #28314A;
  --text: #F1F3F8;
  --muted: #8C95AB;
  --accent: #FF7A45;
  --accent-2: #FFB347;
  --accent-ink: #1A0E07;
  --mint: #3DD6B0;
  --bad: #FF5D73;
  --glow: rgba(255, 122, 69, .28);
  --bezel: #03050A;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #E6E8F0;
    --bg: #F4F5FA;
    --surface: #FFFFFF;
    --surface-2: #EEF0F7;
    --line: #DCE0EB;
    --text: #121726;
    --muted: #5B6479;
    --accent: #E85D24;
    --accent-2: #F59E0B;
    --accent-ink: #FFFFFF;
    --mint: #0B9A77;
    --bad: #D93650;
    --glow: rgba(232, 93, 36, .18);
    --bezel: #1B2030;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #E6E8F0;
  --bg: #F4F5FA;
  --surface: #FFFFFF;
  --surface-2: #EEF0F7;
  --line: #DCE0EB;
  --text: #121726;
  --muted: #5B6479;
  --accent: #E85D24;
  --accent-2: #F59E0B;
  --accent-ink: #FFFFFF;
  --mint: #0B9A77;
  --bad: #D93650;
  --glow: rgba(232, 93, 36, .18);
  --bezel: #1B2030;
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding: 24px 20px 40px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.intro {
  max-width: 1180px;
  margin: 0 auto 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 12px 24px;
}
.intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.2vw, 34px); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.intro p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.laptop { max-width: 1180px; margin: 0 auto; background: var(--bezel); border-radius: 22px; padding: 14px; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6); }
.screen {
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: min(760px, 78vw);
  min-height: 560px;
  position: relative;
}
.screen::before {
  content: "";
  position: absolute;
  inset: -40% 40% auto -10%;
  height: 420px;
  background: radial-gradient(closest-side, var(--glow), transparent);
  pointer-events: none;
}

.top { display: flex; align-items: center; gap: 14px; padding: 14px 18px 10px; position: relative; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 14px; }
.chipbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip .num { font-size: 13px; }
.chip.money { color: var(--mint); }
.x { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 700; }

.tabs { display: flex; gap: 6px; padding: 4px 18px 12px; overflow-x: auto; position: relative; scrollbar-width: thin; }
.tab {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  color: var(--muted);
}
.tab svg { width: 17px; height: 17px; }
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 6px; }
.tab.locked { opacity: .55; }

.main { flex: 1; overflow-y: auto; padding: 6px 18px 22px; position: relative; }
.h { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin: 6px 0 14px; }
.h h2 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.025em; margin: 0; }
.h p { color: var(--muted); margin: 0; max-width: 56ch; text-wrap: pretty; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; } .span-6 { grid-column: span 6; }

.hero { background: linear-gradient(150deg, var(--surface) 30%, var(--surface-2)); position: relative; overflow: hidden; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 5vw, 56px); letter-spacing: -.035em; line-height: 1; margin: 4px 0 6px; }
.delta { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--mint) 16%, transparent); color: var(--mint); }
.spark { width: 100%; height: 88px; display: block; margin-top: 12px; }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.mini { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.mini .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.mini .v { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 8px 10px; }
.av { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-family: var(--display); color: #fff; }
.feed .t { font-weight: 700; font-size: 14px; }
.feed .m { font-size: 12.5px; color: var(--muted); }
.feed .p { font-family: var(--mono); font-weight: 700; }
.timer { font-size: 11.5px; font-weight: 700; color: var(--bad); }

.meter { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter b { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.boost { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin-top: 10px; font-weight: 600; }
.boost .num { color: var(--accent); }
.cta { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 10px 18px; cursor: pointer; font-family: var(--display); letter-spacing: -.01em; }
.cta:hover { filter: brightness(1.08); }
.cta.ghost { background: var(--surface-2); color: var(--text); }
.cta[disabled] { opacity: .45; cursor: not-allowed; }

/* Einkauf */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.p {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 18px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  display: grid;
  gap: 8px;
}
.p .img { height: 70px; border-radius: 12px; display: grid; place-items: center; }
.p .img span { width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, .85); box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .4); }
.p .n { font-weight: 700; }
.p .m { font-size: 12.5px; color: var(--muted); }
.p[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.p[disabled] { cursor: not-allowed; opacity: .5; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); justify-self: start; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { border: 1px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 12px 14px; text-align: left; cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.opt[aria-pressed="true"] .m { color: inherit; opacity: .7; }
.opt .n { font-weight: 700; display: flex; justify-content: space-between; }
.opt .m { font-size: 12.5px; color: var(--muted); }
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.q { border: 0; border-radius: 16px; background: var(--surface-2); padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.q:hover:not([disabled]) { background: var(--accent); color: var(--accent-ink); }
.q .v { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.q .c { font-family: var(--mono); font-size: 12px; }
.q[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; }
.toggle i { width: 42px; height: 24px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--text); top: 2px; left: 2px; transition: transform .2s; }
.toggle input:checked + i { background: var(--accent); }
.toggle input:checked + i::after { transform: translateX(18px); background: var(--accent-ink); }
.toggle input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Webshop */
.listing { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.listing:last-child { border-bottom: 0; }
.listing .img { width: 56px; height: 56px; border-radius: 14px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.stepper button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface); cursor: pointer; font-weight: 800; }
.stepper span { min-width: 64px; text-align: center; font-family: var(--mono); font-weight: 700; }
.demand { width: 120px; }
.demand .m { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Postfach */
.mail { display: grid; grid-template-columns: 290px 1fr; gap: 12px; }
.threads { display: grid; gap: 8px; align-content: start; }
.thread { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.thread[aria-current="true"] { border-color: var(--accent); }
.thread .t { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.thread .m { font-size: 12.5px; color: var(--muted); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
.msg h3 { font-family: var(--display); text-transform: none; letter-spacing: -.02em; font-size: 24px; color: var(--text); margin: 0 0 4px; }
.msg .from { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.msg p { max-width: 60ch; }
.answers { display: grid; gap: 8px; margin-top: 14px; }
.answers .cta { text-align: left; display: flex; justify-content: space-between; }
.placeholder { color: var(--muted); max-width: 58ch; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); }

@media (max-width: 960px) {
  .span-5, .span-7, .span-4, .span-8, .span-6 { grid-column: span 12; }
  .mail { grid-template-columns: 1fr; }
  .qgrid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  body { padding-inline: 16px; }
  .laptop { padding: 8px; border-radius: 14px; }
  .screen { height: auto; min-height: 0; }
  .opts { grid-template-columns: 1fr; }
  .minis { grid-template-columns: 1fr 1fr; }
  .listing { grid-template-columns: 44px 1fr; }
  .listing .img { width: 44px; height: 44px; }
  .chipbar .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    ['home', 'Start', 'i-home'], ['mail', 'Postfach', 'i-mail', 2], ['buy', 'Einkauf', 'i-cart'], ['pack', 'Verpackung', 'i-box'],
    ['shop', 'Webshop', 'i-globe'], ['mkt', 'Marketing', 'i-mega'], ['brand', 'Branding', 'i-tag'], ['trade', 'Trading', 'i-trend'],
    ['bank', 'Bank', 'i-bank'], ['staff', 'Personal', 'i-users', 0, true], ['build', 'Ausbau', 'i-build'], ['goals', 'Ziele', 'i-trophy']
  ];
  const mails = [
    { t: 'Shitstorm!', from: 'Social Media', time: 'vor 22 min', pending: true, text: 'Ein Kunde behauptet auf TikTok, dein Produkt hätte sein Handy „geschmolzen“. 40.000 Kommentare. Was tust du?',
      choices: [['Entschuldigen und Gutscheine verteilen', '100 €'], ['Ignorieren', ''], ['Mit einem Meme antworten', 'Risiko']] },
    { t: 'Kooperationsanfrage', from: '@lara.lifestyle · 1,2 Mio.', time: 'vor 1 Std', pending: true, text: 'Hey! Ich würde dein Produkt in meiner Story zeigen. Kostet dich nur 300 €. Deal?', choices: [['Deal!', '300 €'], ['Ablehnen', '']] },
    { t: 'Lieferung angekommen', from: 'PaketBlitz', time: 'vor 2 Std', text: '20 × Handyhülle stehen am Wareneingang neben dem Tor.' },
    { t: 'Ein Brief von Oma', from: 'Oma Gerda', time: 'gestern', text: 'Mein Enkel, der Geschäftsmann! Ich hab dir 100 Euro beigelegt. Kauf dir was Warmes.' }
  ];
  const euro = v => (v < 0 ? '−' : '') + Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €';
  const cents = v => v.toFixed(2).replace('.', ',') + ' €';
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');

  function renderTabs() {
    tabs.innerHTML = apps.map(([id, label, ic, badge, locked]) =>
      `<button type="button" class="tab${locked ? ' locked' : ''}" data-app="${id}" ${state.app === id ? 'aria-current="page"' : ''}><svg aria-hidden="true"><use href="#${ic}"/></svg>${label}${badge ? `<span class="b">${badge}</span>` : ''}${locked ? ' 🔒' : ''}</button>`).join('');
  }
  tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-app]');
    if (!b) return;
    state.app = b.dataset.app;
    render();
  });
  const head = (t, s) => `<div class="h"><h2>${t}</h2><p>${s}</p></div>`;

  function spark() {
    const v = [96, 188, 240, 205, 361, 452, 412];
    const W = 400, H = 88, lo = 0, hi = 480;
    const x = i => 4 + (W - 8) * i / (v.length - 1);
    const y = a => 6 + (H - 12) * (1 - (a - lo) / (hi - lo));
    const pts = v.map((a, i) => `${x(i)},${y(a)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Umsatz der letzten sieben Tage, zuletzt 412 Euro">
      <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <polygon points="4,${H} ${pts} ${W - 4},${H}" fill="url(#sg)"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(6)}" cy="${y(412)}" r="5" fill="var(--accent)"/></svg>`;
  }

  const views = {
    home() {
      return head('Hey, NovaGoods', 'Tag 6 läuft gut. Du hast gestern 452 € gemacht, heute bist du bei 412 €.') + `
      <div class="grid">
        <section class="card hero span-7">
          <h3>Umsatz heute <span class="delta">▲ 9 % zu gestern</span></h3>
          <div class="big num">412 €</div>
          <div style="color:var(--muted);font-weight:600">17 Pakete verschickt · 1 Bestellung verloren</div>
          ${spark()}
          <div class="minis">
            <div class="mini"><div class="k">Bewertung</div><div class="v">4,2 ★</div></div>
            <div class="mini"><div class="k">Level 4</div><div class="v">74 %</div></div>
            <div class="mini"><div class="k">Lager</div><div class="v">71/400</div></div>
          </div>
        </section>
        <section class="card span-5">
          <h3>Neue Bestellungen <span style="color:var(--text)">4 / 6</span></h3>
          <ul class="feed">
            <li><span class="av" style="background:#EE6B9E">S</span><div><div class="t">Sabine K.</div><div class="m">Handyhülle · <span class="timer">wartet 48 min</span></div></div><span class="p">22 €</span></li>
            <li><span class="av" style="background:#E8B923">D</span><div><div class="t">Dennis</div><div class="m">LED-Lichterkette · 21 min</div></div><span class="p">39 €</span></li>
            <li><span class="av" style="background:#EE6B9E">G</span><div><div class="t">Oma Gerda</div><div class="m">Handyhülle · 9 min</div></div><span class="p">22 €</span></li>
            <li><span class="av" style="background:#5B6076">L</span><div><div class="t">Laura M.</div><div class="m">Massagepistole · gerade eben</div></div><span class="p">99 €</span></li>
          </ul>
        </section>
        <section class="card span-6">
          <h3>Hype-Level <span style="color:var(--accent)">×1,6</span></h3>
          <div class="meter"><b style="width:62%"></b></div>
          <div class="boost"><span>⚡ Facebook-Ads</span><span class="num">noch 74 min</span></div>
          <div class="boost"><span>🔥 TikTok-Trend</span><span class="num">bereit</span></div>
        </section>
        <section class="card span-6">
          <h3>Nächstes Ziel</h3>
          <div style="font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em">Vierstellig</div>
          <div style="color:var(--muted);margin-bottom:10px">Erreiche 1.000 € Umsatz · Belohnung 150 €</div>
          <div class="meter"><b style="width:86%"></b></div>
          <div class="row" style="margin-top:12px"><span class="num" style="color:var(--muted)">864 / 1.000 €</span><button type="button" class="cta ghost" data-go="goals">Alle Ziele</button></div>
        </section>
      </div>`;
    },
    buy() {
      const p = products[state.product], s = suppliers[state.supplier];
      let h = head('Einkauf', 'Such dir ein Produkt, einen Lieferanten und eine Menge aus. Die Kiste kommt am Wareneingang an.');
      h += '<div class="grid"><section class="card span-12"><h3>Produkt</h3><div class="pgrid">';
      products.forEach((q, i) => {
        h += `<button type="button" class="p" data-prod="${i}" ${q.lock ? 'disabled' : `aria-pressed="${i === state.product}"`}>
          <span class="img" style="background:color-mix(in srgb, ${q.color} 70%, var(--surface-2))"><span></span></span>
          <span class="n">${q.name}</span><span class="m">ab ${cents(q.cost)} · Markt ~${q.market} €</span>
          <span class="pill">${q.lock ? q.lock : 'Lager ' + q.stock + ' · Karton ' + q.size}</span></button>`;
      });
      h += '</div></section><section class="card span-12"><h3>Lieferant</h3><div class="opts">';
      suppliers.forEach((q, i) => {
        h += `<button type="button" class="opt" data-sup="${i}" aria-pressed="${i === state.supplier}"><span class="n">${q.name}<span>${'★'.repeat(q.stars)}</span></span>
          <span class="m">Preis ×${q.mult.toFixed(2).replace('.', ',')} · ~${Math.round(q.lead * (state.express ? .5 : 1))} min</span></button>`;
      });
      h += `</div></section><section class="card span-12"><h3>Menge · ${p.name}</h3><div class="qgrid">`;
      bulks.forEach((b, i) => {
        const cost = Math.round(p.cost * b.qty * b.disc * s.mult) + (state.express ? 8 : 0);
        h += `<button type="button" class="q" data-bulk="${i}" ${b.lock || cost > state.money ? 'disabled' : ''}><span class="v">${b.qty} Stk</span><span class="c">${b.lock ? 'braucht ' + b.lock : euro(cost) + ' · ' + cents(cost / b.qty)}</span></button>`;
      });
      h += `</div><div class="row" style="margin-top:14px"><label class="toggle"><input type="checkbox" id="express" ${state.express ? 'checked' : ''}><i></i>Express: halbe Lieferzeit, +8 €</label><span style="color:var(--muted);font-size:13px">1 Lieferung unterwegs · Ankunft in 18 min</span></div></section></div>`;
      return h;
    },
    shop() {
      let h = head('Webshop', 'Deine Produkte, deine Preise. Knapp unter dem Marktpreis verkaufst du viel und behältst eine gute Marge.');
      h += '<div class="grid"><section class="card span-12"><h3>Sortiment <span style="color:var(--text)">~3,4 Bestellungen / Std</span></h3>';
      products.slice(0, 3).forEach((p, i) => {
        const pr = state.prices[i];
        const d = state.listed[i] ? Math.min(1, p.demand * Math.pow(p.market / pr, 1.6)) : 0;
        h += `<div class="listing"><span class="img" style="background:${p.color}"></span>
          <div><div style="font-weight:700">${p.name}</div><label class="toggle" style="font-size:13px;margin-top:4px"><input type="checkbox" data-list="${i}" ${state.listed[i] ? 'checked' : ''}><i></i>${state.listed[i] ? 'online' : 'offline'}</label></div>
          <div class="stepper"><button type="button" data-price="${i}" data-d="-1" aria-label="Preis senken">−</button><span>${pr} €</span><button type="button" data-price="${i}" data-d="1" aria-label="Preis erhöhen">+</button></div>
          <div class="demand"><div class="meter"><b style="width:${Math.round(d * 100)}%"></b></div><div class="m">Markt ${p.market} € · Marge ${euro(pr - p.cost)}</div></div></div>`;
      });
      h += '</section></div>';
      return h;
    },
    mail() {
      const m = mails[state.mail];
      let h = head('Postfach', 'Zwei Entscheidungen sind offen. Um 20 Uhr gilt automatisch die vorsichtigste Antwort.');
      h += '<div class="mail"><div class="threads">';
      mails.forEach((q, i) => {
        h += `<button type="button" class="thread" data-mail="${i}" ${i === state.mail ? 'aria-current="true"' : ''}><span class="t">${q.pending ? '<span class="live" aria-label="offen"></span>' : ''}${q.t}</span><span class="m">${q.from} · ${q.time}</span></button>`;
      });
      h += `</div><article class="card msg"><h3>${m.t}</h3><div class="from">${m.from} · ${m.time}</div><p>${m.text}</p>`;
      if (m.pending) {
        h += '<div class="answers">' + m.choices.map((c, i) => `<button type="button" class="cta ${i ? 'ghost' : ''} answer"><span>${c[0]}</span><span>${c[1]}</span></button>`).join('') + '</div>';
      }
      return h + '</article></div>';
    }
  };

  function render() {
    renderTabs();
    const a = apps.find(x => x[0] === state.app);
    main.innerHTML = views[state.app] ? views[state.app]() : head(a[1], 'Im Entwurf nicht ausgearbeitet.') + '<p class="placeholder">Im Spiel bekommt diese App denselben Aufbau: große Kennzahl oben, darunter runde Karten.</p>';
    main.scrollTop = 0;
  }
  let tt;
  function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

  main.addEventListener('click', e => {
    const t = e.target;
    const go = t.closest('[data-go]'); if (go) { state.app = go.dataset.go; render(); return; }
    const pb = t.closest('[data-prod]'); if (pb && !pb.disabled) { state.product = +pb.dataset.prod; render(); return; }
    const sb = t.closest('[data-sup]'); if (sb) { state.supplier = +sb.dataset.sup; render(); return; }
    const bb = t.closest('[data-bulk]');
    if (bb && !bb.disabled) {
      const p = products[state.product], b = bulks[+bb.dataset.bulk], s = suppliers[state.supplier];
      const cost = Math.round(p.cost * b.qty * b.disc * s.mult) + (state.express ? 8 : 0);
      state.money -= cost;
      document.getElementById('money').textContent = euro(state.money);
      toast(`${b.qty} × ${p.name} bestellt · −${euro(cost)}`);
      render(); return;
    }
    const pr = t.closest('[data-price]'); if (pr) { const i = +pr.dataset.price; state.prices[i] = Math.max(1, state.prices[i] + (+pr.dataset.d)); render(); return; }
    const mb = t.closest('[data-mail]'); if (mb) { state.mail = +mb.dataset.mail; render(); return; }
    if (t.closest('.answer')) toast('Im Spiel wird die Entscheidung jetzt ausgewertet.');
  });
  main.addEventListener('change', e => {
    if (e.target.id === 'express') { state.express = e.target.checked; render(); }
    if (e.target.dataset.list) { state.listed[+e.target.dataset.list] = e.target.checked; render(); }
  });
  render();
})();
</script>
