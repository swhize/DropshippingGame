<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop Seiten Comic</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#161616;--paper:#fffdf6}
body{background:#3b3b3b;font:14px "Comic Neue",sans-serif;color:var(--ink);padding:18px 12px 40px}
.laptop{max-width:1200px;margin:0 auto;border:4px solid var(--ink);border-radius:14px;background:#d9d4c7;box-shadow:8px 8px 0 #111;overflow:hidden}
/* browser chrome */
.chrome{background:#e9e4d6;border-bottom:3px solid var(--ink);padding:6px 8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;padding:4px 12px;background:#cfc9b8;cursor:pointer;white-space:nowrap;font-weight:700}
.tab.on{background:var(--paper);position:relative;top:3px}
.bar{display:flex;gap:8px;align-items:center;background:var(--paper);border-top:3px solid var(--ink);margin:0 -8px;padding:6px 8px}
.bar .nb{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;text-align:center;line-height:22px;cursor:pointer;background:#fff;font-weight:700}
.url{flex:1;border:2px solid var(--ink);border-radius:20px;padding:3px 12px;background:#fff;font-family:monospace}
.page{height:640px;overflow-y:auto;background:var(--paper);position:relative}
@media(max-width:800px){.page{height:560px}}
.b3{border:3px solid var(--ink)}
.sh{box-shadow:4px 4px 0 var(--ink)}
.bang{font-family:Bangers,cursive;letter-spacing:1px}
.dots{background-image:radial-gradient(rgba(0,0,0,.18) 1.2px,transparent 1.3px);background-size:7px 7px}
button,.btn{font:700 14px "Comic Neue";border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 14px;cursor:pointer;background:#fff;border-radius:8px}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stars{color:#ffb400;-webkit-text-stroke:1px var(--ink);letter-spacing:1px}
.muted{color:#6b6558}
.strike{text-decoration:line-through;color:#8a8373}
a.l{cursor:pointer;text-decoration:underline}

/* ===== AllesExpress ===== */
.ae{--c:#e63312}
.ae .hd{background:var(--c);border-bottom:3px solid var(--ink);padding:10px 16px;display:flex;gap:14px;align-items:center}
.ae .logo{font:34px Bangers;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.ae .search{flex:1;display:flex}
.ae .search input{flex:1;border:3px solid var(--ink);border-right:0;border-radius:20px 0 0 20px;padding:7px 14px;font:inherit}
.ae .search button{border-radius:0 20px 20px 0;box-shadow:none;background:#ffd23f}
.ae .cats{display:flex;gap:16px;padding:8px 16px;border-bottom:3px solid var(--ink);background:#fff;font-weight:700;overflow-x:auto;white-space:nowrap}
.ae .deal{margin:14px 16px;background:#ffd23f;padding:14px 18px;display:flex;align-items:center;gap:18px;border-radius:12px}
.ae .deal .big{font:48px Bangers;color:var(--c);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);line-height:1}
.ae .timer span{display:inline-block;background:var(--ink);color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;margin:0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:0 16px 20px}
.card{background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.card .img{height:150px;border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.card .badge{position:absolute;top:6px;left:6px;background:var(--c,#ff4b1f);color:#fff;font:16px Bangers;padding:1px 6px;border:2px solid var(--ink);border-radius:4px}
.card .t{padding:6px 8px 0;font-size:13px;height:38px;overflow:hidden;line-height:1.3}
.card .p{padding:2px 8px;font:24px Bangers;color:var(--c,#ff4b1f)}
.card .m{padding:0 8px 8px;font-size:12px}
/* product page */
.pp{display:grid;grid-template-columns:360px 1fr 250px;gap:18px;padding:16px}
@media(max-width:900px){.pp{grid-template-columns:1fr}}
.gal .main{height:320px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.gal .th{display:flex;gap:8px;margin-top:8px}
.gal .th div{width:60px;height:60px;border:3px solid var(--ink);border-radius:8px;cursor:pointer}
.pp h1{font-size:19px;line-height:1.3}
.price{display:flex;align-items:baseline;gap:10px;background:var(--pbg,#fff1ec);padding:10px;border-radius:10px;margin:10px 0}
.price .now{font:40px Bangers;color:var(--c);-webkit-text-stroke:1px var(--ink)}
.price .off{background:var(--c);color:#fff;padding:1px 6px;border:2px solid var(--ink);border-radius:4px;font-weight:700}
.coupon{display:inline-block;border:2px dashed var(--c);color:var(--c);padding:3px 8px;font-weight:700;margin:2px 4px 2px 0}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.vars div{border:3px solid var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;background:#fff}
.vars div.on{background:#ffd23f}
.qty{display:flex;align-items:center;gap:6px}
.qty span{border:3px solid var(--ink);padding:3px 12px;border-radius:6px;background:#fff;font-weight:700;min-width:50px;text-align:center}
.side{background:#fff;padding:12px;border-radius:12px}
.side .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:2px dotted #ccc}
.ptabs{display:flex;gap:6px;padding:0 16px;border-bottom:3px solid var(--ink)}
.ptabs div{border:3px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:5px 14px;cursor:pointer;background:#eee;font-weight:700;position:relative;top:3px}
.ptabs div.on{background:var(--paper)}
.pbody{padding:16px;max-width:900px;line-height:1.55}
.rev{border-bottom:2px dashed #cfc9b8;padding:10px 0;display:grid;grid-template-columns:48px 1fr;gap:10px}
.av{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font:20px Bangers}
.rsum{display:flex;gap:24px;align-items:center;margin-bottom:10px}
.rsum .n{font:54px Bangers}
.hist div{display:flex;gap:6px;align-items:center;font-size:12px}
.hist i{display:block;height:9px;border:2px solid var(--ink);background:#ffb400;border-radius:4px}

/* ===== iWolke ===== */
.iw{display:grid;grid-template-columns:190px 330px 1fr;height:100%;background:#f4f7fb}
.iw .f{padding:14px 8px;border-right:3px solid var(--ink);background:#e7eef8}
.iw .f h3{font:26px Bangers;color:#2f7cf6;-webkit-text-stroke:1px var(--ink);margin:0 6px 12px}
.iw .f div{padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between}
.iw .f div.on{background:#2f7cf6;color:#fff;border:2px solid var(--ink)}
.iw .ls{border-right:3px solid var(--ink);overflow-y:auto;background:#fff}
.iw .ml{padding:9px 12px;border-bottom:2px solid #e3e3e3;cursor:pointer;position:relative}
.iw .ml.u::before{content:"";position:absolute;left:3px;top:14px;width:8px;height:8px;border-radius:50%;background:#2f7cf6;border:1px solid var(--ink)}
.iw .ml.on{background:#d9e8ff}
.iw .ml .s{font-weight:700}
.iw .ml .pv{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw .rd{padding:18px 22px;overflow-y:auto}
.iw .rd h2{font-size:22px;margin-bottom:6px}
.iw .rd .who{display:flex;gap:10px;align-items:center;border-bottom:2px solid #ddd;padding-bottom:10px;margin-bottom:14px}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;position:relative;line-height:1.55;box-shadow:4px 4px 0 var(--ink)}
@media(max-width:900px){.iw{grid-template-columns:1fr}.iw .f,.iw .ls{display:none}}

/* ===== PaketBlitz ===== */
.pb{background:#ffcc00;min-height:100%}
.pb .hd{background:#ffcc00;border-bottom:3px solid var(--ink);padding:10px 16px;display:flex;align-items:center;gap:16px}
.pb .logo{font:38px Bangers;color:#d40511;font-style:italic;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:skew(-8deg)}
.pb .nav{display:flex;gap:16px;font-weight:700}
.pb .box{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:12px;margin:16px;padding:16px}
.pb .track{display:flex;gap:8px;margin-top:8px}
.pb .track input{flex:1;border:3px solid var(--ink);border-radius:8px;padding:8px;font:inherit}
.pb .red{background:#d40511;color:#fff}
.steps{display:flex;justify-content:space-between;margin:18px 0 6px;position:relative}
.steps::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:6px;background:#ddd;border:2px solid var(--ink);border-radius:4px}
.steps .st{z-index:1;text-align:center;width:20%;font-size:12px;font-weight:700}
.steps .st i{display:block;margin:0 auto 4px;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:#fff;font:18px/32px Bangers;font-style:normal}
.steps .st.ok i{background:#ffcc00}
.steps .st.now i{background:#d40511;color:#fff}
.pbrow{display:grid;grid-template-columns:70px 1fr 110px 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #ccc}
.label{width:280px;background:#fff;border:3px solid var(--ink);font:12px Arial}
.label .top{display:flex;border-bottom:3px solid var(--ink)}
.label .top b{font:44px Bangers;border-right:3px solid var(--ink);padding:0 12px;color:#d40511}
.label .bc{height:56px;margin:8px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 7px,#fff 7px 8px,#000 8px 9px,#fff 9px 12px,#000 12px 15px,#fff 15px 16px)}

/* ===== TradingViech ===== */
.tv{background:#131722;color:#d1d4dc;display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto 1fr;height:100%}
.tv .top{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:3px solid #000;background:#1e222d}
.tv .logo{font:28px Bangers;color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #2962ff}
.tv .sym{border:2px solid #fff;border-radius:6px;padding:2px 10px;font-weight:700}
.tv .tf span{padding:2px 7px;cursor:pointer;border-radius:4px}
.tv .tf span.on{background:#2962ff;color:#fff}
.tv .chart{position:relative;border-right:3px solid #000}
.tv .wl{background:#1e222d;overflow-y:auto}
.tv .wl div{display:grid;grid-template-columns:1fr 70px 60px;padding:7px 10px;border-bottom:1px solid #2a2e39;cursor:pointer;font-size:13px}
.tv .wl div.on{background:#2a2e39}
.up{color:#26a69a}.dn{color:#ef5350}
.tv .order{padding:12px;border-top:3px solid #000}
.tv .order button{width:48%;color:#fff;border-color:#000;box-shadow:3px 3px 0 #000}
.tv .quip{position:absolute;right:16px;top:14px;background:#fff;color:#111;border:3px solid #000;border-radius:14px;padding:8px 12px;max-width:230px;box-shadow:4px 4px 0 #000;font-weight:700}
.tv .quip::after{content:"";position:absolute;left:24px;bottom:-14px;border:7px solid transparent;border-top-color:#000}
@media(max-width:900px){.tv{grid-template-columns:1fr}.tv .wl{display:none}}

/* ===== Shopifly ===== */
.sf{background:#f1f5ee;min-height:100%}
.sf .hd{background:#fff;border-bottom:3px solid var(--ink);padding:10px 16px;display:flex;align-items:center;gap:16px}
.sf .logo{font:30px Bangers;color:#5c9e31;-webkit-text-stroke:1px var(--ink)}
.sf .brand{margin:14px 16px;padding:22px;border-radius:14px;background:#1f3a5f;color:#fff}
.sf .brand h2{font:44px Bangers;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.sf .grid .card{--c:#1f3a5f}

/* ===== VERSPIELT: AllesExpress + Mein Shop ===== */
.ae,.sf{font-family:Fredoka,"Comic Neue",sans-serif;--soft:0 6px 0 rgba(0,0,0,.07),0 10px 24px rgba(0,0,0,.08)}
.ae{background:#fff7f2;min-height:100%}
.sf{background:#f3f7ff}
.ae .b3,.sf .b3,.ae .card,.sf .card,.ae button,.sf button,.ae .vars div,.sf .vars div,.ae .qty span,.sf .qty span,.ae .gal .th div,.sf .gal .th div,.ae .ptabs div,.sf .ptabs div,.ae .av,.sf .av,.ae .card .img,.sf .card .img{border:0!important}
.ae .sh,.sf .sh,.ae .card,.sf .card{box-shadow:var(--soft)!important}
.ae .dots,.sf .dots{background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:22px 22px}
.ae button,.sf button{border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15)!important;font-family:Fredoka;font-weight:600;padding:9px 18px;transition:transform .12s}
.ae button:hover,.sf button:hover{transform:translateY(-2px) rotate(-1deg)}
.ae button:active,.sf button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)!important}
/* Kopf AllesExpress */
.ae .hd{background:linear-gradient(90deg,#ff5a36,#ff8a1f);border:0;border-radius:0 0 26px 26px;padding:14px 20px}
.ae .logo{font:700 30px Fredoka;-webkit-text-stroke:0;text-shadow:none;letter-spacing:-1px}
.ae .logo::after{content:"✦";font-size:18px;vertical-align:top;margin-left:2px;color:#ffe45c}
.ae .search input{border:0;border-radius:999px 0 0 999px;padding:10px 18px;font-family:Fredoka}
.ae .search button{border-radius:0 999px 999px 0;box-shadow:none!important;background:#ffe45c}
.ae .cats{display:none!important;background:transparent;border:0;gap:8px;padding:12px 20px 4px}
.ae .cats span{background:#fff;border-radius:999px;padding:5px 14px;box-shadow:var(--soft);font-weight:500}
.ae .cats span:nth-child(2){background:#ff5a36;color:#fff}
.ae .deal{background:linear-gradient(120deg,#ffe45c,#ffb36b);border-radius:24px;margin:14px 20px;transform:rotate(-.6deg)}
.ae .deal .big{font:700 44px Fredoka;-webkit-text-stroke:0;text-shadow:3px 3px 0 #fff;color:#e63312}
.ae .timer span{border-radius:10px;background:#e63312}
/* Karten */
.ae .grid,.sf .grid{gap:18px;padding:6px 20px 24px}
.ae .card,.sf .card{border-radius:22px;transition:transform .15s}
.ae .card:hover,.sf .card:hover{transform:translateY(-4px) rotate(-.8deg)}
.ae .card:nth-child(even):hover,.sf .card:nth-child(even):hover{transform:translateY(-4px) rotate(.8deg)}
.ae .card .img,.sf .card .img{margin:8px;border-radius:16px;height:140px}
.ae .card .badge{border:0;border-radius:999px;font:600 13px Fredoka;padding:3px 9px;transform:rotate(-8deg);background:#e63312}
.ae .card .p,.sf .card .p{font:700 22px Fredoka}
.ae .card .p{color:#e63312}
/* Produktseite */
.ae .gal .main,.sf .gal .main{border-radius:28px}
.ae .gal .th div,.sf .gal .th div{border-radius:14px;box-shadow:var(--soft)}
.ae .price,.sf .price{border-radius:20px}
.ae .price .now,.sf .price .now{font:700 38px Fredoka;-webkit-text-stroke:0}
.ae .price .now{color:#e63312}
.ae .price .off,.sf .price .off{border:0;border-radius:999px;padding:2px 10px;transform:rotate(-4deg);display:inline-block}
.ae .price .off{background:#e63312}
.ae .coupon,.sf .coupon{border-radius:10px;background:#fff}
.ae .vars div,.sf .vars div{border-radius:999px;box-shadow:var(--soft);padding:6px 16px}
.ae .vars div.on{background:#ff5a36;color:#fff}
.sf .vars div.on{background:#4c6fff;color:#fff}
.ae .qty span,.sf .qty span{border-radius:999px;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.ae .side,.sf .side{border-radius:24px}
.ae .ptabs,.sf .ptabs{border:0;gap:8px;padding:6px 20px}
.ae .ptabs div,.sf .ptabs div{border-radius:999px;top:0;background:#fff;box-shadow:var(--soft)}
.ae .ptabs div.on{background:#ff5a36;color:#fff}
.sf .ptabs div.on{background:#4c6fff;color:#fff}
.ae .stars,.sf .stars{-webkit-text-stroke:0}
.ae .hist i,.sf .hist i{border:0;border-radius:999px;height:10px}
.ae .rev,.sf .rev{border-bottom:2px dotted #f0d9cc;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;border-bottom:0;box-shadow:var(--soft)}
.ae .rsum .n,.sf .rsum .n{font:700 52px Fredoka}
/* Kopf Mein Shop */
.sf .hd{border:0;border-radius:0 0 26px 26px;box-shadow:var(--soft)}
.sf .logo{font:700 26px Fredoka;-webkit-text-stroke:0;color:#4c6fff}
.sf .logo::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50% 50% 50% 0;background:#ffb020;margin-right:6px;transform:rotate(-20deg)}
.sf .brand{background:linear-gradient(120deg,#4c6fff,#9b6bff);border-radius:28px;margin:16px 20px;position:relative;overflow:hidden}
.sf .brand h2{font:700 40px Fredoka;-webkit-text-stroke:0;text-shadow:none;letter-spacing:-1px}
.sf .brand::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:#ffb020;opacity:.85}
.sf .grid .card{--c:#4c6fff}
.sf .card .p{color:#4c6fff}

/* ===== Runde 2 verspielt ===== */
.ae svg [stroke="#161616"],.sf svg [stroke="#161616"]{stroke:rgba(40,20,60,.55)}
.ae svg [fill="#161616"],.sf svg [fill="#161616"]{fill:rgba(40,20,60,.6)}
.ae svg,.sf svg{filter:drop-shadow(0 10px 6px rgba(60,30,90,.18))}
.ae .card .img,.sf .card .img,.ae .gal .main,.sf .gal .main{background-image:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),rgba(255,255,255,0) 55%)!important;background-size:auto!important}
.ae{background:#fff7f2 radial-gradient(circle at 10% 0,#ffe1d3 0,transparent 30%) no-repeat}
.ae .hd{position:relative}
.mascot{width:46px;height:40px;background:#ffe45c;border-radius:50% 50% 45% 45%;position:relative;flex:none;animation:bob 2.4s ease-in-out infinite}
.mascot::before,.mascot::after{content:"";position:absolute;top:13px;width:7px;height:9px;background:#3a2140;border-radius:50%}
.mascot::before{left:13px}.mascot::after{right:13px}
.mascot i{position:absolute;left:17px;top:25px;width:12px;height:6px;border-radius:0 0 12px 12px;background:#e63312}
@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
.circ{display:flex;gap:18px;padding:16px 20px 6px;overflow-x:auto}
.circ div{text-align:center;font-size:13px;font-weight:500;cursor:pointer;flex:none;width:74px}
.circ span{display:flex;width:64px;height:64px;margin:0 auto 5px;border-radius:50%;align-items:center;justify-content:center;font:700 22px Fredoka;color:#fff;transition:transform .15s}
.circ div:hover span{transform:scale(1.1) rotate(-6deg)}
.tickets{display:flex;gap:12px;padding:6px 20px 12px;overflow-x:auto}
.tk{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 14px 8px 10px;box-shadow:var(--soft);position:relative}
.tk b{font:700 22px Fredoka;color:#e63312}
.tk::before,.tk::after{content:"";position:absolute;left:62px;width:14px;height:14px;border-radius:50%;background:#fff7f2}
.tk::before{top:-7px}.tk::after{bottom:-7px}
.tk .sep{border-left:2px dashed #ffd0c0;height:34px}
.tk .get{background:#e63312;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.h2{display:flex;align-items:center;gap:10px;padding:10px 20px 4px;font:700 22px Fredoka}
.h2 .pill{font:500 13px Fredoka;background:#3a2140;color:#fff;border-radius:999px;padding:3px 10px}
.flash{display:flex;gap:14px;padding:6px 20px 12px;overflow-x:auto}
.fl{flex:none;width:150px;background:#fff;border-radius:20px;padding:8px;box-shadow:var(--soft);cursor:pointer;transition:transform .15s}
.fl:hover{transform:translateY(-4px) rotate(1deg)}
.fl .im{height:110px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.fl b{display:block;font:700 19px Fredoka;color:#e63312;margin-top:6px}
.prog{height:14px;border-radius:999px;background:#ffe1d3;overflow:hidden;position:relative;margin-top:4px}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff8a1f,#e63312)}
.prog span{position:absolute;left:8px;top:-1px;font-size:10px;font-weight:600;color:#fff}
.hot{position:absolute;right:-6px;top:-8px;background:#ffe45c;color:#e63312;font:700 12px Fredoka;border-radius:999px;padding:3px 8px;transform:rotate(12deg);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.card{position:relative}
.watch{display:inline-flex;align-items:center;gap:6px;background:#fff0f4;color:#d6336c;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px;margin-top:6px}
.watch::before{content:"";width:8px;height:8px;border-radius:50%;background:#d6336c;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* Mein Shop */

function bind(){
 document.querySelectorAll("[data-prod]").forEach(e=>e.onclick=()=>go(app,{k:"prod",p:P.find(p=>p.id==e.dataset.prod)}));
 document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(app,{k:"home"}));
 document.querySelectorAll("[data-tab]").forEach(e=>e.onclick=()=>{view.tab=e.dataset.tab;render()});
 document.querySelectorAll("[data-vi]").forEach(e=>e.onclick=()=>{view.vi=+e.dataset.vi;render()});
 document.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{view.m=+e.dataset.m;render()});
 document.querySelectorAll("[data-bm]").forEach(e=>e.onclick=()=>{view.bm=+e.dataset.bm;render()});
 const kr=document.getElementById("kr");if(kr)kr.oninput=()=>{view.kr=+kr.value;render()};
 document.querySelectorAll("[data-like]").forEach(e=>e.onclick=()=>{view.lk=!view.lk;render()});
 document.querySelectorAll("[data-next]").forEach(e=>e.onclick=()=>{view.v=((view.v||0)+1)%VIDS.length;view.lk=false;render()});
 document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{view.s=+e.dataset.s;render()});
}
render();
